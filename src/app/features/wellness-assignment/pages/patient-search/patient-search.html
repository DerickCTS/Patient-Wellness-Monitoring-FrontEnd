<div class="search-container">
  <div class="search-card">
    <h2 class="card-title">🔍 Patient Search</h2>

    <!-- Tab Buttons -->
    <div class="tab-group">
      <button
        class="tab-button"
        [class.active]="searchType === 'patientName'"
        (click)="onTabChange(0)"
      >
        Search by Name
      </button>
      <button
        class="tab-button"
        [class.active]="searchType === 'patientId'"
        (click)="onTabChange(1)"
      >
        Search by Patient ID
      </button>
    </div>

    <!-- Search Form -->
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()" class="search-form">
      <div class="search-field">
        <label>
          {{ searchType === 'patientName' ? 'Patient Name' : 'Patient ID' }}
        </label>
        <input
          type="text"
          formControlName="query"
          placeholder="Enter {{ searchType === 'patientName' ? 'patient name' : 'patient ID' }}"
        />
      </div>

      <button type="submit" class="search-btn" [disabled]="isLoading">
        Search
      </button>
    </form>

    <!-- Loading Indicator -->
    <div *ngIf="isLoading" class="progress-bar"></div>
  </div>

  <!-- Results Section -->
  <div class="results-container" *ngIf="results$ | async as results">
    <h3 class="results-title">Search Results ({{ results.length }})</h3>

    <div
      *ngFor="let patient of results"
      class="patient-card"
      (click)="selectPatient(patient.patientId)"
    >
      <img
        [src]="wellnessService.getFullImageUrl(patient.profileImage)"
        alt="Patient"
        class="patient-avatar"
      />
      <div class="patient-info">
        <div class="patient-name">
          {{ patient.firstName }} {{ patient.lastName }}
          <span class="patient-id">(ID: {{ patient.patientId }})</span>
        </div>
        <div class="patient-details">
          <span>👤 {{ patient.gender }}</span>
          <span>🩸 Blood: {{ patient.bloodGroup }}</span>
        </div>
      </div>
    </div>

    <div
      *ngIf="results.length === 0 && searchAttempted && !isLoading"
      class="empty-state"
    >
      <p>🔍 No patients found matching your query.</p>
    </div>
  </div>
</div>
