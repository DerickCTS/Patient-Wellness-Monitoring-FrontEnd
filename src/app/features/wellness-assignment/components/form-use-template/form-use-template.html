<div class="template-container">
  <!-- =============== TEMPLATE SELECTION VIEW =============== -->
  <div *ngIf="!selectedTemplate; else formView">
    <h2 class="view-title">Select a Wellness Template</h2>

    <div *ngIf="isLoadingTemplates" class="loading-state">
      <div class="spinner"></div>
      <p>Loading templates...</p>
    </div>

    <div *ngIf="templates$ | async as templates" class="template-grid">
      <div
        *ngFor="let template of templates"
        class="template-card"
        (click)="onTemplateSelected(template)"
      >
        <div class="template-image">
          <img
            [src]="wellnessService.getFullImageUrl(template.imageUrl)"
            alt="{{ template.planName }}"
          />
        </div>
        <div class="template-info">
          <h4 class="plan-name">{{ template.planName }}</h4>
          <p class="plan-goal">{{ template.goal }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- =============== ASSIGN FORM VIEW =============== -->
  <ng-template #formView>
    <div class="form-header">
      <button class="back-btn" (click)="goBackToTemplates()">← Back</button>
      <h2 class="view-title">Assign: {{ selectedTemplateDetails?.planName }}</h2>
    </div>

    <div *ngIf="isLoadingDetails" class="loading-state">
      <div class="spinner"></div>
      <p>Loading template details...</p>
    </div>

    <form
      *ngIf="!isLoadingDetails"
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="template-form"
    >
      <div *ngIf="isSaving" class="progress-bar"></div>

      <section class="readonly-section card">
        <div class="readonly-field">
          <label>Plan Name</label>
          <p>{{ selectedTemplateDetails?.planName }}</p>
        </div>
        <div class="readonly-field">
          <label>Goal</label>
          <p>{{ selectedTemplateDetails?.goal }}</p>
        </div>
      </section>

      <section class="form-section">
        <div class="form-row">
          <div class="form-field">
            <label>Category</label>
            <select formControlName="Category">
              <option *ngFor="let cat of categories" [value]="cat">
                {{ cat }}
              </option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label>Frequency Count</label>
            <input formControlName="FrequencyCount" type="number" min="1" />
          </div>
          <div class="form-field">
            <label>Frequency Unit</label>
            <select formControlName="FrequencyUnit">
              <option *ngFor="let unit of units" [value]="unit">
                {{ unit }}
              </option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label>Start Date</label>
            <input type="date" formControlName="StartDate" />
          </div>
          <div class="form-field">
            <label>End Date</label>
            <input type="date" formControlName="EndDate" />
          </div>
        </div>
      </section>

      <hr class="divider" />

      <section class="details-section card">
        <div class="details-header">
          <h3>Plan Details</h3>
          <label class="toggle">
            <input
              type="checkbox"
              (change)="toggleEdit(($any({ checked: $event.target.checked })))"
            />
            Enable Editing
          </label>
        </div>

        <div class="form-field full-width">
          <label>Description</label>
          <textarea formControlName="Description" rows="3"></textarea>
        </div>

        <app-form-array-manager
          label="Instructions"
          [formArray]="instructions"
          (addItem)="addItem(instructions)"
          (removeItem)="removeItem(instructions, $event)"
        ></app-form-array-manager>

        <app-form-array-manager
          label="Benefits"
          [formArray]="benefits"
          (addItem)="addItem(benefits)"
          (removeItem)="removeItem(benefits, $event)"
        ></app-form-array-manager>

        <app-form-array-manager
          label="Safety"
          [formArray]="safety"
          (addItem)="addItem(safety)"
          (removeItem)="removeItem(safety, $event)"
        ></app-form-array-manager>
      </section>

      <div class="form-actions">
        <button class="submit-btn" type="submit" [disabled]="isSaving">
          {{ isSaving ? "Assigning..." : "Assign Wellness Plan" }}
        </button>
      </div>
    </form>
  </ng-template>
</div>
