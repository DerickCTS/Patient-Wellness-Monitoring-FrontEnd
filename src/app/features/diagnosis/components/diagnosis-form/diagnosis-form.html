<div class="form-card">
  <form [formGroup]="diagnosisForm" (ngSubmit)="onSave()">
    <div class="card-content">
      <div class="form-field full-width">
        <label for="disease-select">Disease / Condition *</label>
        <select id="disease-select" formControlName="DiseaseId">
          <option value="" disabled selected>Please select...</option>
          <option
            *ngFor="let disease of diseases$ | async"
            [value]="disease.diseaseId"
          >
            {{ disease.diseaseName }}
          </option>
        </select>
        <div
          class="error-message"
          *ngIf="diagnosisForm.get('DiseaseId')?.hasError('required')"
        >
          Please select a disease
        </div>
      </div>

      <div class="form-field full-width">
        <label for="description-textarea"
          >Clinical Notes / Diagnosis Description *</label
        >
        <textarea
          id="description-textarea"
          formControlName="Description"
          rows="5"
          placeholder="Enter detailed diagnosis, symptoms observed, test results..."
        ></textarea>
        <div
          class="error-message"
          *ngIf="diagnosisForm.get('Description')?.hasError('required')"
        >
          Description is required
        </div>
      </div>
    </div>

    <div class="form-actions" style="text-align: right;">
      <button type="button" (click)="onCancel()" class="btn-cancel">
        Cancel
      </button>
      <button type="submit" class="btn-primary">
        Save Diagnosis
      </button>
    </div>
  </form>
</div>
