<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
  <div *ngIf="isLoading" class="progress-bar"></div>
  
  <div
    class="form-field"
    [class.ng-invalid]="loginForm.get('Email')?.invalid && loginForm.get('Email')?.touched"
  >
    <label for="Email">Email</label>
    <div class="input-wrapper">
      <i class="icon input-prefix">alternate_email</i>
      <input 
        id="Email"
        formControlName="Email"
        placeholder="Enter your email"
        type="email"
      />
    </div>
    <div 
      class="error-message"
      *ngIf="(loginForm.get('Email')?.hasError('required') || loginForm.get('Email')?.hasError('email')) && loginForm.get('Email')?.touched"
    >
      A valid email is required
    </div>
  </div>

  <div
    class="form-field"
    [class.ng-invalid]="loginForm.get('Password')?.invalid && loginForm.get('Password')?.touched"
  >
    <label for="Password">Password</label>
    <div class="input-wrapper">
      <i class="icon input-prefix">lock</i>
      <input
        id="Password"
        formControlName="Password"
        [type]="hidePassword ? 'password' : 'text'"
        placeholder="Enter password"
      />
      <button
        class="icon-button"
        type="button"
        (click)="hidePassword = !hidePassword"
      >
        <i class="icon">{{ hidePassword ? 'visibility_off' : 'visibility' }}</i>
      </button>
    </div>
    <div 
      class="error-message"
      *ngIf="loginForm.get('Password')?.hasError('required') && loginForm.get('Password')?.touched"
    >
      Password is required
    </div>
  </div>
  
  <button
    type="submit"
    class="login-button"
    [disabled]="isLoading || loginForm.invalid"
  >
    {{ isLoading ? 'Logging In...' : 'Login' }}
  </button>
</form>
