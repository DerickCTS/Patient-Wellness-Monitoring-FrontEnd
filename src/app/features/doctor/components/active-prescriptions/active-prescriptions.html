<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="header-icon prescription-icon">📄</span>
      <h2>Active Prescriptions</h2>
      <button class="close-btn" (click)="closeModal()">X</button>
    </div>
    <p class="modal-subtitle">Currently active prescriptions you've issued</p>

    <div class="main-stat-block green-gradient">
      <div class="stat-value">{{ data?.totalActive }}</div>
      <div class="stat-change positive-white">
        +{{ data?.percentageChange }}%
      </div>
    </div>

    <div class="breakdown-grid prescription-grid">
      <div class="breakdown-item">
        <p class="item-label">New This Week</p>
        <p class="item-value">{{ data?.newThisWeek }}</p>
      </div>
      <div class="breakdown-item">
        <p class="item-label">Expiring Soon</p>
        <p class="item-value">{{ data?.expiringSoon }}</p>
      </div>
      <div class="breakdown-item full-width">
        <p class="item-label">Total Active</p>
        <p class="item-value">{{ data?.totalActive }}</p>
      </div>
    </div>
  </div>
</div>
