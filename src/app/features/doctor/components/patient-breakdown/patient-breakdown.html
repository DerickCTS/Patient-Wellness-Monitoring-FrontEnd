<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="header-icon patient-icon">👤</span>
      <h2>Total Patients</h2>
      <button class="close-btn" (click)="closeModal()">X</button>
    </div>
    <p class="modal-subtitle">Total number of patients under your care</p>

    <div class="main-stat-block blue-gradient">
      <div class="stat-value">{{ data?.totalCount | number }}</div>
      <div class="stat-change positive-white">
        +{{ data?.percentageChange }}%
      </div>
    </div>

    <div class="breakdown-grid patient-grid">
      <div class="breakdown-item">
        <p class="item-label">New This Month</p>
        <p class="item-value">{{ data?.newThisMonth }}</p>
      </div>
      <div class="breakdown-item">
        <p class="item-label">Active Patients</p>
        <p class="item-value">{{ data?.activePatients | number }}</p>
      </div>
      <div class="breakdown-item full-width">
        <p class="item-label">Inactive Patients</p>
        <p class="item-value">{{ data?.inactivePatients }}</p>
      </div>
    </div>
  </div>
</div>
